<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spin the Decades — Host Set List</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2E8D8;
    --card:#FBF6EC;
    --ink:#241C14;
    --ink-soft:#5b4f3f;
    --gold:#C98A1F;
    --line:#d9cba9;
    --d50:#B23A2E;
    --d60:#C98A1F;
    --d70:#47795A;
    --d80:#6A4C93;
    --d90:#2E6E8E;
    --d00:#B23368;
    --dtv:#5B5F97;
    --gRock:#8B5E3C;
    --gPop:#E85D9C;
    --gRnB:#8E5FD9;
    --gHipHop:#3A3A3A;
    --gCountry:#A9701F;
    --gDisco:#29ADB2;
    --gAlt:#556B5D;
    --gThemes:#5B5F97;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:34px 24px 60px;
  }
  .controls{
    text-align:center;
    margin-bottom:8px;
  }
  .controls h1{
    font-family:'Bungee',cursive;
    font-size:clamp(26px,5vw,40px);
    margin:0 0 6px;
    letter-spacing:.4px;
  }
  .controls h1 span{color:var(--gold);}
  .controls p.sub{
    color:var(--ink-soft);
    margin:0 auto 18px;
    max-width:560px;
    font-size:14.5px;
    line-height:1.5;
  }
  .bar{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:26px;
  }
  .bar button{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:14px;
    border:none;
    border-radius:999px;
    padding:10px 22px;
    cursor:pointer;
  }
  .btn-primary{background:var(--ink);color:var(--paper);}
  .btn-secondary{background:transparent;color:var(--ink);border:1.5px solid var(--ink);}

  .summary{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    justify-content:center;
    margin-bottom:30px;
  }
  .summary span{
    font-size:12px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    color:#fff;
    padding:6px 13px;
    border-radius:999px;
  }

  .decade-section{
    margin-bottom:26px;
    break-inside:avoid;
  }
  .decade-title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
  }
  .decade-title .swatch{
    width:14px;height:14px;border-radius:4px;flex-shrink:0;
  }
  .decade-title h2{
    font-family:'Bungee',cursive;
    font-size:19px;
    margin:0;
    letter-spacing:.3px;
  }
  .decade-title .count{
    font-family:'JetBrains Mono',monospace;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-left:auto;
  }

  table{
    width:100%;
    border-collapse:collapse;
    background:var(--card);
    border:1.5px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  th{
    text-align:left;
    font-size:10.5px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--ink-soft);
    padding:8px 10px;
    border-bottom:1.5px solid var(--line);
  }
  td{
    padding:8px 10px;
    font-size:13px;
    border-bottom:1px solid var(--line);
    vertical-align:middle;
  }
  tr:last-child td{border-bottom:none;}
  .check-col{width:34px;text-align:center;}
  .check-box{
    width:16px;height:16px;
    border:1.8px solid var(--ink-soft);
    border-radius:4px;
    display:inline-block;
  }
  .yr-col{
    width:56px;
    font-family:'JetBrains Mono',monospace;
    color:var(--ink-soft);
    font-size:12px;
  }
  .title-cell{font-weight:700;}
  .artist-cell{color:var(--ink-soft);}

  .d50{background:var(--d50);} .d60{background:var(--d60);} .d70{background:var(--d70);}
  .d80{background:var(--d80);} .d90{background:var(--d90);} .d00{background:var(--d00);} .dtv{background:var(--dtv);}
  .gRock{background:var(--gRock);} .gPop{background:var(--gPop);} .gRnB{background:var(--gRnB);}
  .gHipHop{background:var(--gHipHop);} .gCountry{background:var(--gCountry);} .gDisco{background:var(--gDisco);}
  .gAlt{background:var(--gAlt);} .gThemes{background:var(--gThemes);}

  .genre-cell{white-space:nowrap;}
  .genre-chip{
    display:inline-block;
    font-size:9.5px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    color:#fff;
    padding:3px 8px;
    border-radius:999px;
  }
  .genre-summary{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    margin:-10px auto 26px;
  }
  .genre-summary span{
    font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
    color:#fff;padding:5px 11px;border-radius:999px;
  }

  @media print{
    .controls{display:none;}
    body{background:#fff;}
    .decade-section{page-break-inside:avoid;}
  }
</style>
</head>

      <tr>
        <td class="check-col"><span class="check-box"></span></td>
        <td class="yr-col">${s.y}</td>
        <td class="title-cell">${s.t}</td>
        <td class="artist-cell">${s.a}</td>
        <td class="genre-cell"><span class="genre-chip ${GENRE_CLASS[s.g]||''}">${s.g}</span></td>
      </tr>
    `).join('');

    summaryHtml += `<span class="${cls}">${dec} · ${songs.length} songs</span>`;

    html += `
      <div class="decade-section">
        <div class="decade-title">
          <span class="swatch ${cls}"></span>
          <h2>${DECADE_LABEL[dec]}</h2>
          <span class="count">${songs.length} songs</span>
        </div>
        <table>
          <thead>
            <tr><th class="check-col"></th><th class="yr-col">Year</th><th>Title</th><th>Artist</th><th>Genre</th></tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    `;
  });

  GENRE_ORDER.forEach(g=>{
    const count = SONGS.filter(s=>s.g===g).length;
    genreSummaryHtml += `<span class="${GENRE_CLASS[g]}">${g} · ${count} songs</span>`;
  });

  document.getElementById('summary').innerHTML = summaryHtml;
  const genreSummaryEl = document.getElementById('genreSummary');
  if(genreSummaryEl) genreSummaryEl.innerHTML = genreSummaryHtml;
  container.innerHTML = html;
}

render();
</script>
</body>
</html>
